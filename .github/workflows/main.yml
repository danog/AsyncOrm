name: build
on:
  pull_request:
  push:
jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php-versions: ["8.2", "8.3", "8.4", "8.5", "8.6"]
    name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, intl, sockets, :mongodb
          tools: pie

      # The MongoDB backend's tests run with danog/mongo-php-async-driver (the mongodb extension, with revolt-rs
      # built in, so every test runs on its native event loop). PIE downloads its pre-built binary, or builds it
      # from source (with cargo and libclang) for the versions that have none.
      - name: Install the mongodb extension
        run: |
          # The runner image has clang and libclang: an older libclang-dev next to them fails the bindings.
          ls /usr/lib/llvm-*/lib/libclang.so* >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libclang-dev; }
          # PIE needs root to write the extension dir, and can't prompt for it: run it with sudo, keeping the
          # runner's PATH and HOME for cargo (source builds).
          sudo env "PATH=$PATH" "HOME=$HOME" "$(command -v pie)" install --no-interaction danog/mongo-php-async-driver
          grep -rn mongodb /etc/php/${{ matrix.php-versions }}/ || true
          ls -la /etc/php/${{ matrix.php-versions }}/cli/conf.d/ | grep -i -e mongo -e pecl
          php -r 'if ((new ReflectionClass(Revolt\EventLoop::class))->getExtensionName() !== "mongodb") { exit(1); }'

      - name: Check environment
        run: |
          php --version
          composer --version

      - name: Get composer cache directory
        id: composercache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: ${{ matrix.os }}-composer-${{ matrix.php-versions }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ matrix.os }}-composer-${{ matrix.php-versions }}-

      - name: Install dependencies
        run: |
          composer install --prefer-dist
          wget https://github.com/infection/infection/releases/download/0.27.0/infection.phar -O /usr/local/bin/infection
          chmod +x /usr/local/bin/infection

      - name: Run codestyle check
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1
        run: |
          vendor/bin/php-cs-fixer --diff --dry-run -v fix
      
      - name: Run unit tests
        run: |
          vendor/bin/phpunit 
      # --coverage-text --coverage-clover build/logs/clover.xml

      #- name: Run mutation tests
      #  env:
      #    STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
      #  run: |
      #    infection --show-mutations

      - name: Run Psalm analysis
        run: |
          vendor/bin/psalm --shepherd

